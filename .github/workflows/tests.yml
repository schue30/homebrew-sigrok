name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon on macOS 26 only. These bottles won't install on
        # older macOS releases, which build from source instead.
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # github.com repository pages currently answer 504 to automated
      # requests, which fails the online homepage audit for micronucleus.
      # `brew audit --new` implies `--online`, so skip both.
      - run: brew test-bot --only-formulae --skip-online-checks --skip-new
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
